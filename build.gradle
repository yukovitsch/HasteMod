plugins {
    id 'net.fabricmc.fabric-loom' version '1.17-SNAPSHOT' apply false
    id 'net.neoforged.moddev' version "${neoforge_moddev_version}" apply false
}

import java.util.zip.GZIPInputStream
import java.util.zip.GZIPOutputStream

def targetMc = findProperty("mc") ?: "26.1"
def versionFile = file("versions/${targetMc}.properties")

allprojects {
    layout.buildDirectory = file("build-${targetMc}")
    if (versionFile.exists()) {
        def props = new Properties()
        versionFile.withInputStream { props.load(it) }
        props.each { key, val ->
            project.ext.set(key.toString(), val.toString())
        }
    }
}

ext.patchLevelDat = { File levelDat, String targetMcVer ->
    def dataVersionMap = [
        '26.1': 4786,
        '26.2': 4903,
        '26.3': 5023
    ]
    def targetDataVer = dataVersionMap[targetMcVer]
    if (!levelDat.exists() || targetDataVer == null) return

    byte[] raw
    levelDat.withInputStream { is ->
        new GZIPInputStream(is).withStream { gzipIn ->
            raw = gzipIn.bytes
        }
    }

    def tagWithPrefix = { int tagType, String tagName ->
        byte[] nameBytes = tagName.getBytes("UTF-8")
        ByteArrayOutputStream baos = new ByteArrayOutputStream()
        baos.write(tagType)
        baos.write((byte) ((nameBytes.length >> 8) & 0xFF))
        baos.write((byte) (nameBytes.length & 0xFF))
        baos.write(nameBytes)
        return baos.toByteArray()
    }

    def findPattern = { byte[] src, byte[] pattern ->
        for (int i = 0; i <= src.length - pattern.length; i++) {
            boolean match = true
            for (int j = 0; j < pattern.length; j++) {
                if (src[i + j] != pattern[j]) {
                    match = false
                    break
                }
            }
            if (match) return i
        }
        return -1
    }

    // Update DataVersion: TAG_Int(3) + "DataVersion"
    byte[] dataVerTag = tagWithPrefix(3, "DataVersion")
    int posDataVer = findPattern(raw, dataVerTag)
    if (posDataVer != -1) {
        int vOff = posDataVer + dataVerTag.length
        byte[] intBytes = [
            (byte) ((targetDataVer >> 24) & 0xFF),
            (byte) ((targetDataVer >> 16) & 0xFF),
            (byte) ((targetDataVer >> 8) & 0xFF),
            (byte) (targetDataVer & 0xFF)
        ] as byte[]
        System.arraycopy(intBytes, 0, raw, vOff, 4)
    }

    // Update Version.Id: TAG_Int(3) + "Id" (exact NBT tag match, will NOT match "modId")
    byte[] idTag = tagWithPrefix(3, "Id")
    int posId = findPattern(raw, idTag)
    if (posId != -1) {
        int vOff = posId + idTag.length
        byte[] intBytes = [
            (byte) ((targetDataVer >> 24) & 0xFF),
            (byte) ((targetDataVer >> 16) & 0xFF),
            (byte) ((targetDataVer >> 8) & 0xFF),
            (byte) (targetDataVer & 0xFF)
        ] as byte[]
        System.arraycopy(intBytes, 0, raw, vOff, 4)
    }

    // Update Version.Name: TAG_String(8) + "Name" (exact NBT tag match, will NOT match "LevelName")
    byte[] nameTag = tagWithPrefix(8, "Name")
    int posName = findPattern(raw, nameTag)
    if (posName != -1) {
        int vOff = posName + nameTag.length
        int oldStrLen = ((raw[vOff] & 0xFF) << 8) | (raw[vOff + 1] & 0xFF)
        byte[] newNameBytes = targetMcVer.getBytes("UTF-8")

        ByteArrayOutputStream outStream = new ByteArrayOutputStream()
        outStream.write(raw, 0, vOff)
        outStream.write((byte) ((newNameBytes.length >> 8) & 0xFF))
        outStream.write((byte) (newNameBytes.length & 0xFF))
        outStream.write(newNameBytes)
        outStream.write(raw, vOff + 2 + oldStrLen, raw.length - (vOff + 2 + oldStrLen))
        raw = outStream.toByteArray()
    }

    levelDat.withOutputStream { os ->
        new GZIPOutputStream(os).withStream { gzipOut ->
            gzipOut.write(raw)
            gzipOut.finish()
        }
    }
}

subprojects {
    apply plugin: 'java'

    version = rootProject.mod_version
    group = rootProject.maven_group

    base {
        archivesName = "${rootProject.archives_base_name}-${project.name}"
    }

    java {
        sourceCompatibility = JavaVersion.VERSION_25
        targetCompatibility = JavaVersion.VERSION_25
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.release = 25
    }

    tasks.withType(Test).configureEach {
        failOnNoDiscoveredTests = false
    }

    repositories {
        mavenCentral()
        maven { url = "https://maven.isxander.dev/releases" }
        maven { url = "https://maven.terraformersmc.com/" }
        maven { url = "https://maven.neoforged.net/releases" }
    }
}

def runGameTestMatrix = { List<Map<String, String>> targets, int concurrency = 2 ->
    println "\n============================================================"
    println "             RUNNING GAMETEST SUITE MATRIX"
    println "  Targets: ${targets.collect { "${it.loader}:${it.mc}" }.join(', ')}"
    println "  Concurrency: ${concurrency} in parallel"
    println "============================================================\n"

    def executor = java.util.concurrent.Executors.newFixedThreadPool(concurrency)
    def failures = new java.util.concurrent.CopyOnWriteArrayList<String>()

    def tasks = targets.collect { target ->
        def loader = target.loader
        def mcVer = target.mc
        def tag = "${loader.capitalize()} ${mcVer}"
        return {
            println "\n[${tag}] >>> Starting GameTest on Minecraft ${mcVer} (${loader})..."
            long startTime = System.currentTimeMillis()

            def cmd = ['./gradlew', ":${loader}:runClientGameTest".toString(), "-Pmc=${mcVer}".toString(), '--project-cache-dir', ".gradle-${loader}-${mcVer}".toString(), '--no-daemon'] as String[]
            def pb = new ProcessBuilder(cmd)
            pb.directory(project.rootDir)
            pb.redirectErrorStream(true)

            def proc = pb.start()
            def reader = new BufferedReader(new InputStreamReader(proc.inputStream))
            def outputLines = new java.util.concurrent.ConcurrentLinkedQueue<String>()

            boolean passed = false
            String failureReason = null
            String line

            while ((line = reader.readLine()) != null) {
                outputLines.add(line)
                if (outputLines.size() > 40) {
                    outputLines.poll()
                }
                if (line.contains("[GameTest]")) {
                    println "   [${tag}] ${line.substring(line.indexOf('[GameTest]'))}"
                }
                if (line.contains("SUCCESS:") || line.contains("PASSED") || line.contains("ALL TESTS PASSED") || line.contains("ALL HASTEMOD GAMETESTS PASSED")) {
                    passed = true
                }
                if (line.contains("AssertionError:") || line.contains("BUILD FAILED") || line.contains("Execution failed")) {
                    failureReason = line
                }
            }

            proc.waitFor()

            long elapsed = (System.currentTimeMillis() - startTime) / 1000
            if (passed && proc.exitValue() == 0) {
                println "✔ [PASSED] [${tag}] Minecraft ${mcVer} (${loader}) GameTest passed in ${elapsed}s!"
            } else {
                def err = "✘ [FAILED] [${tag}] Minecraft ${mcVer} (${loader}) GameTest failed (${failureReason ?: 'exit code ' + proc.exitValue()})"
                println err
                if (!passed) {
                    println "--- [${tag}] Last console lines ---"
                    outputLines.each { println "   [${tag}] ${it}" }
                }
                failures.add(err)
            }
        } as java.util.concurrent.Callable<Void>
    }

    try {
        executor.invokeAll(tasks)
    } finally {
        executor.shutdown()
    }

    if (!failures.isEmpty()) {
        throw new GradleException("GameTest failures occurred:\n" + failures.join("\n"))
    }

    println "\n============================================================"
    println "       ALL GAMETESTS IN MATRIX PASSED SUCCESSFULLY"
    println "============================================================\n"
}

tasks.register('gameTestAll') {
    description = 'GameTest across all Minecraft versions and loaders (Fabric & NeoForge)'
    group = 'verification'
    doLast {
        def targets = []
        ['26.1', '26.2', '26.3'].each { mc -> targets.add([loader: 'fabric', mc: mc]) }
        ['26.1', '26.2', '26.3'].each { mc -> targets.add([loader: 'neoforge', mc: mc]) }
        int concurrency = project.findProperty("parallel") ? Integer.parseInt(project.property("parallel").toString()) : 2
        runGameTestMatrix(targets, concurrency)
    }
}

def mcVersions = ['26.1', '26.2', '26.3']
mcVersions.each { mc ->
    tasks.register("build${mc.replace('.', '_')}", Exec) {
        description = "Builds Fabric and NeoForge jars for Minecraft ${mc}"
        group = 'build'
        commandLine './gradlew', 'build', "-Pmc=${mc}"
    }
}

tasks.register('buildAll') {
    description = 'Builds Fabric and NeoForge jars for all supported 26.x versions (26.1, 26.2, 26.3)'
    group = 'build'
    dependsOn mcVersions.collect { "build${it.replace('.', '_')}" }
}

def runInteractiveFlow = { List<String> targetMcs, List<String> targetLoaders ->
    def targets = []
    targetMcs.each { mc ->
        targetLoaders.each { l ->
            targets.add([loader: l, mc: mc])
        }
    }

    println "\n============================================================"
    println "      INTERACTIVE RELEASE JAR TEST RUNNER"
    println "  Targets to test sequentially (${targets.size()} total):"
    targets.eachWithIndex { t, idx ->
        println "    ${idx + 1}. [${t.loader.capitalize()}] Minecraft ${t.mc}"
    }
    println "  Auto-load World: saves/gametest (from template-world)"
    println "  Artifact: Shipped release JAR in mods/"
    println "============================================================\n"

    targets.eachWithIndex { t, idx ->
        def loader = t.loader
        def mcVer = t.mc
        def tag = "${loader.capitalize()} ${mcVer}"

        println "\n############################################################"
        println "  [${idx + 1}/${targets.size()}] STARTING ${tag}"
        println "  Running client with QuickPlay Singleplayer ('gametest')..."
        println "  * Close the Minecraft window when done testing to continue *"
        println "############################################################\n"

        def cmd = ['./gradlew', ":${loader}:runClientInteractive".toString(), "-Pmc=${mcVer}".toString(), '--project-cache-dir', ".gradle-${loader}-${mcVer}".toString(), '--no-daemon'] as String[]
        def pb = new ProcessBuilder(cmd)
        pb.directory(project.rootDir)
        pb.inheritIO()

        def proc = pb.start()
        int exitCode = proc.waitFor()

        if (exitCode != 0) {
            println "\n⚠ [${tag}] Minecraft exited with code ${exitCode}."
        } else {
            println "\n✔ [${tag}] Session ended normally."
        }

        if (idx < targets.size() - 1) {
            def nextTarget = targets[idx + 1]
            println "\n------------------------------------------------------------"
            println "  Ready for next version: [${nextTarget.loader.capitalize()}] Minecraft ${nextTarget.mc}"
            print "  Press [ENTER] to launch (or Ctrl+C to abort)... "
            System.out.flush()

            if (System.console() != null) {
                System.console().readLine()
            } else {
                println "\n  (Console input not attached. Starting next in 3 seconds...)"
                Thread.sleep(3000)
            }
        }
    }

    println "\n============================================================"
    println "  ALL INTERACTIVE TEST SESSIONS COMPLETED"
    println "============================================================\n"
}

tasks.register('testInteractive') {
    description = 'Interactively runs Minecraft version by version with shipped release JARs and auto-loads template-world.'
    group = 'verification'

    doLast {
        def targetMcs = project.findProperty('mc') ? project.property('mc').toString().split(',').collect { it.trim() } : ['26.1', '26.2', '26.3']
        def targetLoaders = project.findProperty('loader') ? project.property('loader').toString().split(',').collect { it.trim().toLowerCase() } : ['fabric', 'neoforge']
        runInteractiveFlow(targetMcs, targetLoaders)
    }
}
