plugins {
    id 'net.fabricmc.fabric-loom'
}

sourceSets {
    main {
        resources {
            srcDir project(":common").sourceSets.main.resources
        }
    }
    clientInteractive {
        compileClasspath = configurations.named('compileClasspath').get()
        runtimeClasspath = configurations.named('runtimeClasspath').get()
    }
}

loom {
    runs {
        clientGameTest {
            client()
            name "Client Game Test"
            vmArg "-Dfabric.client.gametest"
            runDir "run-gametest-${rootProject.minecraft_version}"
            source sourceSets.test
        }
        clientInteractive {
            client()
            name "Client Interactive Test"
            runDir "run-interactive-${rootProject.minecraft_version}"
            source sourceSets.clientInteractive
            programArg "--quickPlaySingleplayer"
            programArg "gametest"
        }
    }
}

tasks.register('prepareClientInteractiveRun') {
    dependsOn 'jar'
    doLast {
        def targetMc = rootProject.minecraft_version.toString()
        def runDir = file("run-interactive-${targetMc}")
        def savesDir = file("${runDir}/saves/gametest")
        delete(savesDir)
        savesDir.mkdirs()
        copy {
            from rootProject.file("template-world")
            into savesDir
        }

        // Clean stale lock and old backup to ensure a clean world start
        delete(file("${savesDir}/level.dat_old"))
        delete(file("${savesDir}/session.lock"))

        // Dynamically align level.dat DataVersion and Version.Name to avoid "I know what I'm doing" screen
        rootProject.patchLevelDat(file("${savesDir}/level.dat"), targetMc)

        // Copy built jar into mods/
        def modsDir = file("${runDir}/mods")
        delete(modsDir)
        modsDir.mkdirs()
        def builtJar = tasks.named('jar', Jar).get().archiveFile.get().asFile
        copy {
            from builtJar
            into modsDir
        }
    }
}

tasks.matching { it.name == 'runClientInteractive' }.configureEach {
    dependsOn 'prepareClientInteractiveRun'
}

dependencies {
    minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"

    implementation "net.fabricmc:fabric-loader:${rootProject.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"

    implementation "dev.isxander:yet-another-config-lib:${rootProject.yacl_version}"
    compileOnly "com.terraformersmc:modmenu:${rootProject.modmenu_version}"
    if (!rootProject.minecraft_version.contains("-")) {
        runtimeOnly "com.terraformersmc:modmenu:${rootProject.modmenu_version}"
    }

    implementation project(":common")
}

processResources {
    def mcVersion = rootProject.minecraft_version
    def expandMcVersion = mcVersion.contains('-') ? "${mcVersion.split('-')[0]}-" : mcVersion
    def expandProps = [
        "version": project.version,
        "loader_version": rootProject.loader_version,
        "minecraft_version": expandMcVersion
    ]
    inputs.properties expandProps

    filesMatching("fabric.mod.json") {
        expand expandProps
    }
}

tasks.named('jar', Jar).configure {
    from project(":common").sourceSets.main.output
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.withType(Test).configureEach {
    failOnNoDiscoveredTests = false
}
